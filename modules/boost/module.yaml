# The boost module: gauge pressure, and what the engine did with it.
#
# status: derived -- every claim below was extracted from code that already worked, and is
# proven against it rather than asserted. The derivation reproduces the column the server's
# decode path computes today; see README.md and the equivalence test it names.
#
# Still a partial module. It claims a derivation and the fields that derivation needs. It
# claims no metric, no view, no page and no app gauge, because a metric must name a view
# this module creates and the views have not moved yet. Claiming them here before they
# exist would be a manifest that lies.
schema: cairn.module/v1-draft
id: boost
version: 2
name: Boost and pulls
status: derived
sources:
  - "MAP minus barometric is gauge pressure: contracts/format/v3/spec.md section 4.10, and
    OBDExtended.BoostGaugeKPa / BoostPSI in the server's format package as the reference
    implementation the format vectors pin"
  - "the expression is held to that reference by the server's
    TestBoostPSIDerivationReproducesTheReference, over every manifold value 0..255 against
    eight barometric cases including 0 and both absent cases"

requires:
  # Read by the derivation. map_kpa and baro_kpa are what gauge pressure is computed from;
  # rpm and throttle_pct are what the curve and the pull detection will need when the
  # views move, and are declared now so the engine gate covers the whole module.
  store:
    - boost.map_kpa
    - boost.baro_kpa
    - obd.rpm
    - obd.throttle_pct
  # From engine/v1's acquisition `field` enum. A module STATES these; the firmware's
  # enginegen resolves them against the engine profile being built and fails the build when
  # one is not provided. A module can never make a dongle poll a PID.
  engine_fields:
    - map_kpa
    - baro_kpa
    - rpm
    - throttle_pct

derives:
  # Grandfathered: store/v1 declares this column and the server's decode path computes it
  # today. This takes over the DEFINITION, not the values.
  #
  # A value whenever BOTH readings are present. Deliberately NOT `map_kpa < 255`: a
  # saturated manifold reading is excluded by the views that read this column
  # (v_boost_curve, v_pulls), never by the column, and an earlier draft that excluded it
  # here would have silently turned every saturated sample's boost into NULL. Deliberately
  # not `baro_kpa > 0` either: the reference treats 0 as a reading, not as absence.
  - column: boost.boost_psi
    type: DOUBLE
    expr: "CASE WHEN map_kpa IS NOT NULL AND baro_kpa IS NOT NULL THEN (map_kpa::DOUBLE - baro_kpa::DOUBLE) * 0.1450377 END"
    note: >-
      gauge pressure in psi, negative for vacuum, which is what a throttled engine off
      boost actually reads. Null when either reading is absent: with no barometric figure
      the answer is unknown rather than guessed from a sea-level assumption.
